name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy-repository-scan:
    name: Trivy repository scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Trivy cache
        run: mkdir -p "${{ runner.temp }}/trivy-cache"

      - name: Generate Trivy SARIF report
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -v "${{ runner.temp }}/trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:latest fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --skip-dirs /project/backend/target \
            --skip-dirs /project/frontend/node_modules \
            --skip-dirs /project/frontend/dist \
            --skip-dirs /project/.scannerwork \
            --skip-dirs /project/storage \
            --skip-dirs /project/.git \
            --format sarif \
            --output /project/trivy-results.sarif \
            /project

      - name: Upload Trivy SARIF report
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Enforce critical vulnerability gate
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -v "${{ runner.temp }}/trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:latest fs \
            --scanners vuln,secret,misconfig \
            --severity CRITICAL \
            --ignore-unfixed \
            --skip-dirs /project/backend/target \
            --skip-dirs /project/frontend/node_modules \
            --skip-dirs /project/frontend/dist \
            --skip-dirs /project/.scannerwork \
            --skip-dirs /project/storage \
            --skip-dirs /project/.git \
            --format table \
            --exit-code 1 \
            /project
