name: zalduaxa-net

services:
  matomo-db:
    image: mariadb:lts
    container_name: zalduaxa-matomo-db
    env_file:
      - ${APP_PASSWORD_ENV_FILE:-.env.passwords}
    environment:
      MYSQL_DATABASE: matomo
      MYSQL_USER: matomo
    volumes:
      - matomo_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  matomo:
    image: matomo:5.11.1-apache
    container_name: zalduaxa-matomo
    depends_on:
      matomo-db:
        condition: service_healthy
    env_file:
      - ${APP_PASSWORD_ENV_FILE:-.env.passwords}
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_DBNAME: matomo
      PHP_MEMORY_LIMIT: 256M
    ports:
      - "8082:80"
    volumes:
      - matomo_data:/var/www/html
    restart: unless-stopped

  matomo-cron:
    image: matomo:5.11.1-apache
    container_name: zalduaxa-matomo-cron
    user: "33:33"
    depends_on:
      matomo:
        condition: service_started
    env_file:
      - ${APP_PASSWORD_ENV_FILE:-.env.passwords}
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_DBNAME: matomo
      PHP_MEMORY_LIMIT: 256M
    volumes:
      - matomo_data:/var/www/html
    entrypoint: /bin/sh
    command: >
      -c "while true; do
      php /var/www/html/console core:archive --url=http://matomo:80;
      sleep 3600;
      done"
    restart: unless-stopped
  
  matomo-exporter:
    image: python:3.12-alpine
    container_name: zalduaxa-matomo-exporter
    depends_on:
      - matomo
    env_file:
      - ${APP_ENV_FILE:-.env}
      - ${APP_PASSWORD_ENV_FILE:-.env.passwords}
    environment:
      MATOMO_URL: ${MATOMO_URL:-http://matomo:80/}
      MATOMO_SITE_ID: ${MATOMO_SITE_ID:-1}
      MATOMO_EXPORTER_PORT: ${MATOMO_EXPORTER_PORT:-9101}
      MATOMO_EXPORTER_CACHE_SECONDS: ${MATOMO_EXPORTER_CACHE_SECONDS:-60}
      MATOMO_TOP_PAGES_LIMIT: ${MATOMO_TOP_PAGES_LIMIT:-10}
    volumes:
      - ./monitoring/matomo-exporter/matomo_exporter.py:/app/matomo_exporter.py:ro
    command:
      - "python"
      - "/app/matomo_exporter.py"
    expose:
      - "9101"
    restart: unless-stopped

volumes:
  matomo_db_data:
  matomo_data: