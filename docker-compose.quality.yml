name: zalduaxa-net

services:
  sonarqube-db:
    image: postgres:16
    container_name: zalduaxa-sonarqube-db
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD:-sonarqube}
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonarqube -d sonarqube"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - quality

  sonarqube:
    image: sonarqube:community
    container_name: zalduaxa-sonarqube
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD:-sonarqube}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - quality

  quality-runner:
    build:
      context: ./monitoring/quality-runner
      dockerfile: Dockerfile
    container_name: zalduaxa-quality-runner
    depends_on:
      - frontend
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      QUALITY_RUNNER_PORT: ${QUALITY_RUNNER_PORT:-9102}
      QUALITY_FRONTEND_BASE_URL: ${QUALITY_FRONTEND_BASE_URL:-http://frontend:5173}
      QUALITY_RUNNER_INTERVAL_SECONDS: ${QUALITY_RUNNER_INTERVAL_SECONDS:-900}
      QUALITY_ROUTE_TIMEOUT_MS: ${QUALITY_ROUTE_TIMEOUT_MS:-30000}
      QUALITY_ROUTES: ${QUALITY_ROUTES:-/,/projects,/login,/signup,/__quality_not_found__}
      QUALITY_LIGHTHOUSE_ROUTES: ${QUALITY_LIGHTHOUSE_ROUTES:-/,/projects,/login,/signup}
      QUALITY_LIGHTHOUSE_ENABLED: ${QUALITY_LIGHTHOUSE_ENABLED:-true}
      QUALITY_AXE_ENABLED: ${QUALITY_AXE_ENABLED:-true}
    ports:
      - "9102:9102"
    init: true
    shm_size: "1gb"
    restart: unless-stopped

volumes:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  quality:
    name: zalduaxa-net-quality
