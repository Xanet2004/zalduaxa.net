# Production datasource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Production JWT
app.jwt.secret=${APP_JWT_SECRET}

# Production CORS
app.cors.origin=${APP_CORS_ORIGIN}

# Production auth cookie
app.auth.cookie.secure=${APP_AUTH_COOKIE_SECURE:true}

# Production storage
storage.path=${STORAGE_PATH}

# Production password pepper
app.password.pepper=${APP_PASSWORD_PEPPER}

# Production seed users
app.seed.enabled=${APP_SEED_ENABLED:false}

# These are injected by @Value even if seed is disabled.
# Empty fallback is safe while app.seed.enabled=false.
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD:}
app.seed.guest.password=${APP_SEED_GUEST_PASSWORD:}

# Flyway
spring.flyway.enabled=true
spring.flyway.schemas=zalduaxanet
spring.flyway.default-schema=zalduaxanet
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=false

# Production logging
logging.level.net.zalduaxa=${PROD_LOG_LEVEL:WARN}

# Observability
management.endpoint.health.show-details=never

# OpenAPI / Swagger disabled in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false