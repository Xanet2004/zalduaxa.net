# Development datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zalduaxa_net_dev}
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD:app}

# Development JWT
app.jwt.secret=${APP_JWT_SECRET:dev-only-jwt-secret-change-me-please-32chars-minimum}

# Development CORS
app.cors.origin=${APP_CORS_ORIGIN:http://localhost:5173}

# Development auth cookie
app.auth.cookie.secure=${APP_AUTH_COOKIE_SECURE:false}

# Development storage
storage.path=${STORAGE_PATH:file:/app/storage/}

# Development password pepper
app.password.pepper=${APP_PASSWORD_PEPPER:dev-only-password-pepper-change-me-please-32chars-minimum}

# Development seed users
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD:Admin123!}
app.seed.guest.password=${APP_SEED_GUEST_PASSWORD:Guest123!}

# Flyway
spring.flyway.enabled=true
spring.flyway.schemas=zalduaxanet
spring.flyway.default-schema=zalduaxanet
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=false

# Development logging
logging.level.net.zalduaxa=${DEV_LOG_LEVEL:DEBUG}

# Observability
management.endpoint.health.show-details=always