spring.application.name=backend

# Default profile.
# If no profile is explicitly selected, Spring Boot uses dev.
spring.profiles.default=dev

# PostgreSQL datasource common config
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT common config
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Auth cookie common config
app.auth.cookie.name=${APP_AUTH_COOKIE_NAME:token}
app.auth.cookie.sameSite=${APP_AUTH_COOKIE_SAMESITE:Lax}
app.auth.cookie.domain=${APP_AUTH_COOKIE_DOMAIN:}
app.auth.cookie.path=${APP_AUTH_COOKIE_PATH:/}
app.auth.cookie.maxAgeDays=${APP_AUTH_COOKIE_MAX_AGE_DAYS:1}

# Backend default users common identity values
app.seed.admin.username=${APP_SEED_ADMIN_USERNAME:admin}
app.seed.admin.email=${APP_SEED_ADMIN_EMAIL:admin@example.com}
app.seed.guest.username=${APP_SEED_GUEST_USERNAME:guest}
app.seed.guest.email=${APP_SEED_GUEST_EMAIL:guest@example.com}

# Upload limits
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:25MB}

# JPA / Hibernate
# Keep update until Task 12 introduces Flyway.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming_strategy=org.hibernate.cfg.EJB3NamingStrategy
spring.jpa.properties.hibernate.id.new_generator_mappings=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.hibernate.default_schema=zalduaxanet