name: zalduaxa-net

services:
  postgres:
    image: postgres:16
    container_name: zalduaxa-net-postgres
    environment:
      POSTGRES_DB: zalduaxa_net
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - zalduaxa_net_postgres:/var/lib/postgresql/data
      - ./ddbb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d zalduaxa_net"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zalduaxa-net-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/zalduaxa_net
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_CORS_ORIGIN: http://localhost:5173

      APP_SEED_ENABLED: ${APP_SEED_ENABLED}
      APP_SEED_ADMIN_USERNAME: ${APP_SEED_ADMIN_USERNAME}
      APP_SEED_ADMIN_PASSWORD: ${APP_SEED_ADMIN_PASSWORD}
      APP_SEED_ADMIN_EMAIL: ${APP_SEED_ADMIN_EMAIL}
      APP_SEED_GUEST_USERNAME: ${APP_SEED_GUEST_USERNAME}
      APP_SEED_GUEST_PASSWORD: ${APP_SEED_GUEST_PASSWORD}
      APP_SEED_GUEST_EMAIL: ${APP_SEED_GUEST_EMAIL}

      STORAGE_PATH: file:/app/storage/
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zalduaxa-net-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  zalduaxa_net_postgres: