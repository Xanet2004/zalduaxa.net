name: zalduaxa-net

include:
  - docker-compose.quality.yml
  - docker-compose.tools.yml
  - docker-compose.monitoring.yml
  - docker-compose.analytics.yml

services:
  postgres:
    image: postgres:16
    container_name: zalduaxa-net-postgres
    env_file:
      - ${APP_ENV_FILE:-.env}
      - ${APP_PASSWORD_ENV_FILE:-.env.passwords}
    environment:
      POSTGRES_DB: zalduaxa_net
      POSTGRES_USER: app
    ports:
      - "5432:5432"
    volumes:
      - zalduaxa_net_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d zalduaxa_net"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zalduaxa-net-backend
    env_file:
      - ${APP_ENV_FILE:-.env}
      - ${APP_PASSWORD_ENV_FILE:-.env.passwords}
    environment:
      # Docker-specific datasource URL.
      # Inside Docker, the database host is the postgres service, not localhost.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/zalduaxa_net
      SPRING_DATASOURCE_USERNAME: app
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_MATOMO_ENABLED: ${VITE_MATOMO_ENABLED:-false}
        VITE_MATOMO_URL: ${VITE_MATOMO_URL:-http://localhost:8082/}
        VITE_MATOMO_SITE_ID: ${VITE_MATOMO_SITE_ID:-1}
    container_name: zalduaxa-net-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  zalduaxa_net_postgres: