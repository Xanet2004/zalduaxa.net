name: zalduaxa-net

services:
  postgres:
    image: postgres:16
    container_name: zalduaxa-net-postgres
    environment:
      POSTGRES_DB: zalduaxa_net
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - zalduaxa_net_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d zalduaxa_net"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zalduaxa-net-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/zalduaxa_net
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zalduaxa-net-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  zalduaxa_net_postgres: