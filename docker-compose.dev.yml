name: zalduaxa-net-dev

services:
  postgres:
    image: postgres:16
    container_name: zalduaxa-net-postgres-dev
    environment:
      POSTGRES_DB: zalduaxa_net_dev
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - zalduaxa_net_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d zalduaxa_net_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zalduaxa_net_postgres_dev: